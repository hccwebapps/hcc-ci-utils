description: >
  This command installs trivy and uses it to scan an image
parameters:
  trivy-scan-target:
    type: string
    default: ${CIRCLE_PROJECT_REPONAME}:circleci-app-runtime
  trivy-scan-artifact:
    type: string
    default: /tmp/trivy_scan.txt
steps:
  - run:
      name: Install and verify Trivy
      command: |
        TRIVY_VERSION="0.69.3"
        TRIVY_EXPECTED_SHA="1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

        wget https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz

        SHA_RESULT=$(echo "${TRIVY_EXPECTED_SHA}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c - 2>&1) || SHA_RESULT="FAILED"

        if [ "$SHA_RESULT" != "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz: OK" ]; then
          echo "ERROR: Trivy binary SHA-256 verification failed."
          echo "sha256sum output: ${SHA_RESULT}"
          exit 1
        fi

        tar zxvf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
  - run:
      name: Scan Docker Image with trivy
      command: |
        export TRIVY_DISABLE_VEX_NOTICE=1
        ./trivy image \
        --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
        --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db \
        --ignore-unfixed \
        --severity CRITICAL \
        --no-progress \
        << parameters.trivy-scan-target >> 2>&1 | tee << parameters.trivy-scan-artifact >>
  - run:
      name: Scan docker image - json output
      command: |
        export TRIVY_DISABLE_VEX_NOTICE=1
        ./trivy image \
        --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
        --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db \
        --ignore-unfixed \
        --severity CRITICAL \
        -f json \
        -o /tmp/trivy_scan.json \
        --severity CRITICAL \
        --no-progress \
        << parameters.trivy-scan-target >>
  - run:
      name: Generate SBOM
      command: |
        export TRIVY_DISABLE_VEX_NOTICE=1
        ./trivy image \
        --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
        --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db \
        --format cyclonedx \
        -o /tmp/trivy_sbom.json \
        --no-progress \
        << parameters.trivy-scan-target >>
  - run:
      name: Check critical vuln count
      command: |
        export TRIVY_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' /tmp/trivy_scan.json)
        echo "export TRIVY_COUNT=$(echo ${TRIVY_COUNT})" >> ${BASH_ENV}
        if [ "$TRIVY_COUNT" = "0" ]; then
            echo "export TRIVY_PASS=1" >> ${BASH_ENV}
        else
            echo "export TRIVY_PASS=0" >> ${BASH_ENV}
        fi
        VULN_COUNT_OUTPUT=$(grep "Total:" << parameters.trivy-scan-artifact >> | head -1 || true)
        VULN_COUNT_OUTPUT=${VULN_COUNT_OUTPUT:-"Total: 0"}
        export TRIVY_HEAD=$(printf "<< parameters.trivy-scan-target >> --- %s" "$VULN_COUNT_OUTPUT")
        echo "export TRIVY_HEAD='$(echo ${TRIVY_HEAD})'" >> ${BASH_ENV}
        cat ${BASH_ENV}

  - store_artifacts:
      path: << parameters.trivy-scan-artifact >>
  - store_artifacts:
      path: /tmp/trivy_scan.json
  - store_artifacts:
      path: /tmp/trivy_sbom.json
  - run:
      name: Upload SBOM to S3
      command: |
        TIMESTAMP=$(date +%Y_%m_%d_%H_%M_%S)
        aws s3 cp /tmp/trivy_sbom.json s3://hcc-sbom-shared/docker_image_scans/${CIRCLE_PROJECT_REPONAME}/${TIMESTAMP}/sbom.json
  - run: echo $TRIVY_HEAD
  - slack/notify:
      channel: CAV48UXJT
      color: '#42e2f4'
      message: ':fingerscrossed: :see_no_evil: ${CIRCLE_PROJECT_REPONAME} security scan results:\n \`\`\`${TRIVY_HEAD}\`\`\`\n'
